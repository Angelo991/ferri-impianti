<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ferri Impianti - di Marco Ferri - Idraulico Vicenza</title>
  <meta name="description" content="Ferri Impianti - di Marco Ferri. Idraulico a Vicenza e provincia. Riparazioni urgenti, caldaie, bagni chiavi in mano, climatizzazione.">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      line-height: 1.6;
      color: #222;
      background: #fff;
    }
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px 16px;
      background: linear-gradient(180deg, #f5f9ff 0%, #ffffff 100%);
    }
    .logo {
      font-size: 28px;
      font-weight: 700;
      color: #0a5fc7;
      margin-bottom: 8px;
      line-height: 1.2;
    }
    .tagline {
      font-size: 16px;
      color: #444;
      margin-bottom: 32px;
      padding: 0 8px;
    }
    .call-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #1a73e8;
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 600;
      padding: 16px 24px;
      border-radius: 8px;
      box-shadow: 0 4px 12px rgba(26, 115, 232, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      max-width: calc(100% - 32px);
      word-break: break-word;
      text-align: center;
    }
    .call-btn:active {
      transform: scale(0.98);
    }
    .call-btn:hover {
      box-shadow: 0 6px 16px rgba(26, 115, 232, 0.3);
    }
    .call-note {
      margin-top: 16px;
      font-size: 14px;
      color: #555;
    }
    section {
      padding: 48px 16px;
    }
    .container {
      max-width: 100%;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="container">
      <h1 class="logo">Ferri Impianti - di Marco Ferri</h1>
      <p class="tagline">Idraulico a Vicenza e provincia dal 2009</p>
      <a href="tel:+393334567890" class="call-btn" aria-label="Chiama Ferri Impianti al 333 456 7890">
        Chiama 333 456 7890
      </a>
      <p class="call-note">Pronto intervento anche il sabato (solo urgenze)</p>
    </div>
  </section>
</body>
</html>
